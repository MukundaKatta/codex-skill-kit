[metadata]
name = codex-skill-kit
version = 0.1.0
description = Scaffold and validate Codex skills from the command line.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Mukunda Katta
author_email = mukundkst@gmail.com
url = https://github.com/MukundaKatta/codex-skill-kit
project_urls =
    Homepage = https://github.com/MukundaKatta/codex-skill-kit
    Issues = https://github.com/MukundaKatta/codex-skill-kit/issues
    Source = https://github.com/MukundaKatta/codex-skill-kit
keywords = codex, openai, skills, cli, developer-tools
classifiers =
    Development Status :: 3 - Alpha
    Environment :: Console
    Intended Audience :: Developers
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Software Development :: Quality Assurance

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    codex-skill-kit = codex_skill_kit.cli:main
    csk = codex_skill_kit.cli:main
